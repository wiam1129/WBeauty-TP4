
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBeauty - Gestion des commandes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Barre de navigation -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="#">WBeauty</a>
        </div>
    </nav>

    <main class="container mt-4">

        <h1 class="text-center mb-4">Gestion des commandes</h1>

        <!-- Indicateurs -->
        <div class="row text-center mb-4">

            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Total clients</h5>
                    <h3 id="totalCustomers">0</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Total produits</h5>
                    <h3 id="totalProducts">0</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Total commandes</h5>
                    <h3 id="totalOrders">0</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Montant total</h5>
                    <h3 id="totalAmount">0 DH</h3>
                </div>
            </div>

        </div>

        <!-- Recherche et filtres -->
        <div class="row mb-4">

            <div class="col-md-4 mb-3">
                <input type="text" id="searchInput"
                       class="form-control"
                       placeholder="Rechercher un client">
            </div>

            <div class="col-md-4 mb-3">
                <select id="statusFilter" class="form-select">
                    <option value="all">Tous les statuts</option>
                    <option value="Livree">Livrée</option>
                    <option value="En attente">En attente</option>
                    <option value="Annulee">Annulée</option>
                </select>
            </div>

            <div class="col-md-4 mb-3">
                <select id="categoryFilter" class="form-select">
                    <option value="all">Toutes les catégories</option>
                    <option value="Maquillage">Maquillage</option>
                    <option value="Soin">Soin</option>
                    <option value="Parfum">Parfum</option>
                </select>
            </div>

        </div>

        <!-- Messages d'erreur -->
        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <!-- Affichage des commandes -->
        <div id="ordersContainer" class="row"></div>

        <!-- Détail d'une commande -->
        <div class="modal fade" id="orderModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Détail de la commande</h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Fermer"></button>
                    </div>

                    <div class="modal-body" id="orderDetails"></div>

                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/app.js"></script>

</body>
</html>
